[project]
name = "baba-stock-prediction"
version = "0.1.0"
description = "LSTM model for BABA (Alibaba) stock close price prediction, served via FastAPI."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "tensorflow==2.18.0",
    "yfinance>=0.2.40",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "mlflow>=2.16.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0,<2.2",
    "pyarrow>=17.0.0",
    "pydantic>=2.8.0",
    "python-json-logger>=2.0.7",
    "prometheus-client>=0.20",
    "prometheus-fastapi-instrumentator>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "jupyter>=1.1.0",
    "matplotlib>=3.9.0",
    "ipykernel>=6.29.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
