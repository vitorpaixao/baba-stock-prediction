services:
  api:
    build: .
    image: baba-stock-api:latest
    container_name: baba-api
    ports:
      - "8010:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./models:/app/models
      - ./data/raw:/app/data/raw
    depends_on:
      - mlflow
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    container_name: baba-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: baba-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    container_name: baba-grafana
    ports:
      - "3001:3000"   # host 3001 to avoid colliding with other dev containers on 3000
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  streamlit:
    build: ./frontend
    image: baba-streamlit:latest
    container_name: baba-streamlit
    ports:
      - "8501:8501"
    environment:
      - API_BASE_INTERNAL=http://api:8000
      - API_BASE_BROWSER=http://localhost:8010
      - MLFLOW_URL_BROWSER=http://localhost:5000
      - GRAFANA_URL_BROWSER=http://localhost:3001
      - PROMETHEUS_URL_BROWSER=http://localhost:9090
    volumes:
      - ./frontend:/app
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mlflow-data:
  prometheus-data:
  grafana-data:
